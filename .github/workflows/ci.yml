name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profile_owner
          POSTGRES_PASSWORD: profile_owner
          POSTGRES_DB: profile_analyzer_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U profile_owner -d profile_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://profile_app:profile_app@localhost:5433/profile_analyzer_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://profile_owner:profile_owner@localhost:5433/profile_analyzer_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Bootstrap runtime role
        env:
          PGPASSWORD: profile_owner
        run: |
          psql -h localhost -p 5433 -U profile_owner -d profile_analyzer_test <<'SQL'
          CREATE ROLE profile_app LOGIN PASSWORD 'profile_app';
          GRANT CONNECT ON DATABASE profile_analyzer_test TO profile_app;
          GRANT USAGE ON SCHEMA public TO profile_app;
          SQL

      - name: Lint
        run: ruff check app tests alembic scripts

      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build
